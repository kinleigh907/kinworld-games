<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinworld Games</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #fdf1f7;
    overflow: hidden;
    overflow-x: hidden;
    overscroll-behavior: none;
  }
  #layout {
    display: flex;
    height: 100%;
  }
  #sidebar {
    width: 160px;
    flex-shrink: 0;
    background: #7b2d8e;
    padding: 16px 10px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #sidebar h1 {
    color: white;
    font-size: 1.1em;
    margin: 0 0 10px;
    text-align: center;
  }
  .gameBtn {
    background: #fdf1f7;
    color: #7b2d8e;
    border: none;
    border-radius: 10px;
    padding: 12px 8px;
    font-weight: bold;
    font-size: 0.95em;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .gameBtn.active {
    background: #ff7aa2;
    color: white;
  }
  #gameFrame {
    flex: 1;
    border: none;
  }

  /* On narrow / portrait screens, move the sidebar to a top bar */
  @media (max-width: 600px) {
    #layout { flex-direction: column; }
    #sidebar {
      width: auto;
      flex-direction: row;
      align-items: center;
      overflow-x: auto;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
    }
    #sidebar h1 { display: none; }
  }
</style>
</head>
<body>
  <div id="layout">
    <div id="sidebar">
      <h1>Games</h1>
      <!-- To add a new game: put its HTML file in the games/ folder,
           then add a button here with the matching data-src. -->
      <button class="gameBtn" data-src="games/life.html">Life</button>
      <button class="gameBtn" data-src="games/placeholder.html">New Game</button>
    </div>
    <iframe id="gameFrame"></iframe>
  </div>

  <script>
    var buttons = document.querySelectorAll('.gameBtn');
    var frame = document.getElementById('gameFrame');

    function loadGame(btn) {
      frame.src = btn.getAttribute('data-src');
      buttons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      localStorage.setItem('lastGame', btn.getAttribute('data-src'));
    }

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () { loadGame(btn); });
    });

    var lastGame = localStorage.getItem('lastGame');
    var startBtn = Array.prototype.find.call(buttons, function (b) {
      return b.getAttribute('data-src') === lastGame;
    }) || buttons[0];
    loadGame(startBtn);

    // Auto-refresh when a new version is deployed. We ask the server for
    // just the headers (HEAD, no body) of index.html and the game that's
    // currently open, and compare a fingerprint of those headers to what
    // we saw last time. cache: 'no-store' is what makes this see a fresh
    // deploy instead of an old cached answer.
    var knownSignatures = {};

    function fileSignature(url) {
      return fetch(url, { method: 'HEAD', cache: 'no-store' })
        .then(function (res) {
          return res.headers.get('etag') ||
            res.headers.get('last-modified') ||
            res.headers.get('content-length');
        })
        .catch(function () { return null; });
    }

    function checkOne(url, onChanged) {
      fileSignature(url).then(function (sig) {
        if (!sig) return;
        if (knownSignatures[url] === undefined) {
          knownSignatures[url] = sig;
        } else if (sig !== knownSignatures[url]) {
          knownSignatures[url] = sig;
          onChanged();
        }
      });
    }

    function checkForUpdates() {
      checkOne('index.html', function () { location.reload(); });
      var activeSrc = frame.getAttribute('src');
      if (activeSrc) {
        checkOne(activeSrc, function () {
          // A plain frame.src = activeSrc re-assignment doesn't reload
          // when the value hasn't changed, so add a cache-busting param.
          frame.src = activeSrc.split('?')[0] + '?r=' + Date.now();
        });
      }
    }

    setInterval(checkForUpdates, 20000);
  </script>
</body>
</html>
