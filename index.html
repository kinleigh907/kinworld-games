<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinworld Games</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #fdf1f7;
  }
  #layout {
    display: flex;
    height: 100%;
  }
  #sidebar {
    width: 160px;
    flex-shrink: 0;
    background: #7b2d8e;
    padding: 16px 10px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #sidebar h1 {
    color: white;
    font-size: 1.1em;
    margin: 0 0 10px;
    text-align: center;
  }
  .gameBtn {
    background: #fdf1f7;
    color: #7b2d8e;
    border: none;
    border-radius: 10px;
    padding: 12px 8px;
    font-weight: bold;
    font-size: 0.95em;
    cursor: pointer;
  }
  .gameBtn.active {
    background: #ff7aa2;
    color: white;
  }
  #gameFrame {
    flex: 1;
    border: none;
  }

  /* On narrow / portrait screens, move the sidebar to a top bar */
  @media (max-width: 600px) {
    #layout { flex-direction: column; }
    #sidebar {
      width: auto;
      flex-direction: row;
      align-items: center;
      overflow-x: auto;
    }
    #sidebar h1 { display: none; }
  }
</style>
</head>
<body>
  <div id="layout">
    <div id="sidebar">
      <h1>Games</h1>
      <!-- To add a new game: put its HTML file in the games/ folder,
           then add a button here with the matching data-src. -->
      <button class="gameBtn" data-src="games/life.html">Life</button>
      <button class="gameBtn" data-src="games/placeholder.html">New Game</button>
    </div>
    <iframe id="gameFrame"></iframe>
  </div>

  <script>
    var buttons = document.querySelectorAll('.gameBtn');
    var frame = document.getElementById('gameFrame');

    function loadGame(btn) {
      frame.src = btn.getAttribute('data-src');
      buttons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      localStorage.setItem('lastGame', btn.getAttribute('data-src'));
    }

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () { loadGame(btn); });
    });

    var lastGame = localStorage.getItem('lastGame');
    var startBtn = Array.prototype.find.call(buttons, function (b) {
      return b.getAttribute('data-src') === lastGame;
    }) || buttons[0];
    loadGame(startBtn);
  </script>
</body>
</html>
